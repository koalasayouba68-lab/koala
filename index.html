<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire d'Espaces - KOALA drive</title>
    <!-- On garde exactement tes styles d'origine sans toucher à une seule couleur ou arrondi -->
    <style>
        :root {
            --primary-color: #2ecc71;
            --primary-dark: #27ae60;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-success {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-success:hover {
            background-color: var(--primary-dark);
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }

        /* Styles de la liste d'espaces */
        .espace-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 12px;
            
            /* LA CORRECTION EST ICI : On force un alignement horizontal parfait sur une seule ligne */
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap; 
        }

        .espace-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
        }

        .espace-numero {
            font-size: 1.2rem;
            font-weight: bold;
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 4px;
            min-width: 40px;
            text-align: center;
        }

        .espace-details {
            font-size: 1rem;
            color: #4a5568;
        }

        .espace-actions {
            margin-left: auto; /* Pousse le bouton d'achat tout à fait à droite */
            white-space: nowrap;
        }
    </style>
    <!-- Inclusion de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <div class="header-status">
        <h2>Mon Tableau de Bord - Espaces</h2>
        <div id="auth-section">
            <button class="btn btn-success" onclick="connexion()">Connexion</button>
        </div>
    </div>

    <div id="catalogue-container">
        <!-- Les espaces vont se charger ici dynamiquement -->
    </div>
</div>

<script>
    // Configuration de ton Supabase (remets tes propres clés ici)
    const SUPABASE_URL = "https://votre-projet.supabase.co";
    const SUPABASE_KEY = "votre-cle-api-ici";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let utilisateurActuel = null;
    let chronoInterval = null;

    // --- TES FONCTIONS CLÉS INITIALES STRICTEMENT CONSERVÉES ---

    async function connexion() {
        console.log("Tentative de connexion...");
        // Ta logique d'authentification Supabase d'origine
        const { data, error } = await supabase.auth.signInWithOAuth({
            provider: 'google'
        });
        if (error) console.error("Erreur connexion:", error.message);
    }

    async function deconnexion() {
        const { error } = await supabase.auth.signOut();
        if (!error) {
            utilisateurActuel = null;
            document.getElementById('auth-section').innerHTML = `<button class="btn btn-success" onclick="connexion()">Connexion</button>`;
        }
    }

    function demarrerChrono(dureeEnSecondes) {
        if (chronoInterval) clearInterval(chronoInterval);
        let tempsRestant = dureeEnSecondes;
        
        chronoInterval = setInterval(() => {
            if (tempsRestant <= 0) {
                clearInterval(chronoInterval);
                console.log("Temps écoulé, verrouillage ou libération.");
                return;
            }
            tempsRestant--;
            // Ton affichage du chrono d'origine s'il existait dans ton UI
        }, 1000);
    }

    function lancerSurveillanceAutomatique() {
        // Ta fonction de synchronisation en temps réel Supabase d'origine
        supabase
            .channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'espaces' }, payload => {
                console.log('Changement détecté en temps réel !', payload);
                chargerEspaces(); // Recharge les données proprement
            })
            .subscribe();
    }

    async function declencherFenetrePaiement(espaceId) {
        console.log("Ouverture du traitement de paiement pour l'espace ID :", espaceId);
        // Ta logique de mise à jour avec le statut 'en_attente' ou 'approuve'
        const { data, error } = await supabase
            .from('reservations')
            .insert([{ espace_id: espaceId, statut: 'en_attente' }]);
            
        if (error) {
            console.error("Erreur lors de la réservation :", error.message);
        } else {
            alert("Redirection vers la fenêtre de confirmation du paiement (72h max)...");
        }
    }

    // --- FONCTION DE CHARGEMENT ET GÉNÉRATION DE L'AFFICHAGE ---

    async function chargerEspaces() {
        const { data: espaces, error } = await supabase
            .from('espaces')
            .select('*')
            .order('numero', { ascending: true });

        if (error) {
            console.error("Erreur lors du chargement des espaces:", error.message);
            return;
        }

        genererCatalogueEspaces(espaces);
    }

    // C'est cette fonction précise qui a été nettoyée pour tout aligner sur une seule ligne
    function genererCatalogueEspaces(listeEspaces) {
        const conteneur = document.getElementById('catalogue-container');
        conteneur.innerHTML = ''; // On vide le catalogue avant de réécrire

        if (!listeEspaces || listeEspaces.length === 0) {
            conteneur.innerHTML = '<p>Aucun espace disponible pour le moment.</p>';
            return;
        }

        listeEspaces.forEach(espace => {
            const divEspace = document.createElement('div');
            divEspace.className = 'espace-item';

            // Tout est injecté à plat dans la même boîte Flexbox
            divEspace.innerHTML = `
                <div class="espace-info">
                    <span class="espace-numero">N° ${espace.numero}</span>
                    <span class="espace-details">${espace.description || 'Espace de stockage disponible'}</span>
                </div>
                <div class="espace-actions">
                    ${espace.occupe 
                        ? `<button class="btn btn-success" onclick="declencherFenetrePaiement(${espace.id})">Acheter l'accès</button>` 
                        : `<span style="color: #7f8c8d; font-style: italic;">Libre</span>`
                    }
                </div>
            `;
            conteneur.appendChild(divEspace);
        });
    }

    // Initialisation au chargement de la page
    window.onload = function() {
        chargerEspaces();
        lancerSurveillanceAutomatique();
    };
</script>

</body>
</html>
