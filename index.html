<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f0f2f5; }
        .container { max-width: 400px; margin: 80px auto 20px auto; padding: 20px; }
        
        #header { position: fixed; top: 0; width: 100%; height: 60px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; z-index: 500; box-sizing: border-box; }
        .profil-zone { display: flex; align-items: center; cursor: pointer; }
        .profil-rond { width: 40px; height: 40px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid #2E7D32; }
        
        #menuProfil { display: none; position: fixed; top: 60px; right: 10px; background: white; border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 600; }
        
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: white; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="header">
    <div class="profil-zone" onclick="toggleMenu()">
        <div class="profil-rond" id="btnChangePhoto" onclick="event.stopPropagation(); modifierPhoto()">
            📷
        </div>
        <span style="margin-left: 10px; font-weight: bold;">Profil</span>
        <span style="margin-left: 5px;">▼</span>
    </div>
</div>

<div id="menuProfil">
    <h3>Paramètres du compte</h3>
    <input type="text" id="nomInput" placeholder="Nom">
    <input type="text" id="prenomInput" placeholder="Prénom">
    <input type="tel" id="telInput" placeholder="Numéro de téléphone">
    <button onclick="enregistrerProfil()" style="background:#2E7D32; color:white; border:none; border-radius:5px;">Enregistrer</button>
</div>

<div class="container">
    <div id="loginInterface" class="box">
        <h2>Connexion</h2>
        <input type="tel" id="loginPhone" placeholder="Numéro de téléphone">
        <input type="number" id="loginCode" placeholder="Code à 6 chiffres">
        <button onclick="seConnecter()" style="background:#2E7D32; color:white; border:none; border-radius:5px;">Se connecter</button>
        <button onclick="afficherCreation()">Créer un compte</button>
    </div>

    <div id="creationInterface" class="box" style="display:none;">
        <h2>Créer un compte</h2>
        <input type="tel" id="createPhone" placeholder="Numéro de téléphone">
        <input type="number" id="createCode" placeholder="Code à 6 chiffres">
        <button onclick="validerCreation()">Valider</button>
    </div>

    <!-- C'est ici que le fil d'actualité va s'afficher pour scroller -->
    <div class="fil-actualite"></div>
</div>

<div id="popupPublier" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; padding:20px; box-sizing:border-box;">
    <div style="background:white; padding:20px; border-radius:15px; margin-top:50px; max-width:400px; margin-left:auto; margin-right:auto;">
        <h2 style="text-align:center; color:#2E7D32;">Créer un Statut</h2>
        
        <textarea id="texteStatut" style="width:100%; height:100px; padding:10px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;" placeholder="Écris ton message..."></textarea>
        
        <div style="margin: 10px 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
            <button onclick="changerCouleur('#009E60')" style="height: 40px; background: #009E60; border: none; border-radius: 50%;" title="Vert Faso"></button>
            <button onclick="changerCouleur('#EF2B2D')" style="height: 40px; background: #EF2B2D; border: none; border-radius: 50%;" title="Rouge Faso"></button>
            <button onclick="changerCouleur('#FF8C00')" style="height: 40px; background: #FF8C00; border: none; border-radius: 50%;" title="Orange Soleil"></button>
            <button onclick="changerCouleur('#002366')" style="height: 40px; background: #002366; border: none; border-radius: 50%;" title="Bleu Royal"></button>
            <button onclick="changerCouleur('#8A2BE2')" style="height: 40px; background: #8A2BE2; border: none; border-radius: 50%;" title="Violet Luxe"></button>
            <button onclick="changerCouleur('#FFC0CB')" style="height: 40px; background: #FFC0CB; border: none; border-radius: 50%;" title="Rose Bonbon"></button>
            <button onclick="changerCouleur('#FFD700')" style="height: 40px; background: #FFD700; border: none; border-radius: 50%;" title="Jaune Or"></button>
            <button onclick="changerCouleur('#1A1A1A')" style="height: 40px; background: #1A1A1A; border: none; border-radius: 50%;" title="Noir Élégant"></button>
            <button onclick="changerCouleur('#40E0D0')" style="height: 40px; background: #40E0D0; border: none; border-radius: 50%;" title="Turquoise Eau"></button>
            <button onclick="changerCouleur('linear-gradient(#009E60, #EF2B2D)')" style="height: 40px; background: linear-gradient(#009E60, #EF2B2D); border: none; border-radius: 50%;" title="Dégradé Faso"></button>
        </div>

        <input type="file" id="filePicker" accept="image/*,video/*" style="display:none;">
        
        <button onclick="document.getElementById('filePicker').click()" style="background:#FFA000; color:white; width:100%; padding:12px; border-radius:8px; border:none; margin-top:10px; font-weight:bold;">
            + Ajouter Photo ou Vidéo
        </button>
        
        <div style="margin:15px 0; font-size:14px;">
            <input type="checkbox" id="compressCheck" checked>
            <label for="compressCheck"> Compresser automatiquement</label>
        </div>
        
        <button id="btnPublier" style="background:#2E7D32; color:white; width:100%; padding:15px; border-radius:8px; border:none; font-weight:bold; font-size:16px;">PUBLIER</button>
        <button onclick="fermerPopup()" style="background:#D32F2F; color:white; width:100%; padding:10px; border-radius:8px; border:none; margin-top:10px;">Annuler</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://gkqlmpkmzfvurkzgrjlm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TpKfbr8y19-DzT9dQvlr5Q_2MR-ciXr';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function toggleMenu() {
        const menu = document.getElementById('menuProfil');
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function modifierPhoto() {
        alert("Ouverture de la galerie pour modifier ta photo de profil.");
    }

    function enregistrerProfil() {
        const nom = document.getElementById('nomInput').value;
        const prenom = document.getElementById('prenomInput').value;
        alert("Informations enregistrées pour : " + nom + " " + prenom);
        toggleMenu();
    }

    function afficherCreation() {
        document.getElementById('loginInterface').style.display = 'none';
        document.getElementById('creationInterface').style.display = 'block';
    }

    function validerCreation() {
        alert("Compte créé");
        document.getElementById('creationInterface').style.display = 'none';
        document.getElementById('loginInterface').style.display = 'block';
    }

    function seConnecter() {
        alert("Connexion...");
        document.getElementById('loginInterface').style.display = 'none';
        ouvrirPopup();
    }

    async function chargerStatuts() {
        try {
            const { data: statuts, error } = await _supabase
                .from('statuts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            const filContainer = document.querySelector('.fil-actualite'); 
            if (!filContainer) return;

            filContainer.innerHTML = "";

            statuts.forEach(statut => {
                const carte = document.createElement('div');
                carte.className = "carte-statut";

                let contenuMedia = "";
                if (statut.media_url) {
                    if (statut.media_url.match(/\.(mp4|webm|ogg)$/i)) {
                        contenuMedia = `<video src="${statut.media_url}" controls style="width: 100%; border-radius: 8px; margin-top: 10px;"></video>`;
                    } else {
                        contenuMedia = `<img src="${statut.media_url}" alt="Média" style="width: 100%; border-radius: 8px; margin-top: 10px;">`;
                    }
                }

                carte.innerHTML = `
                    <div style="background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                        <p style="margin: 0; font-size: 16px; color: #333;">${statut.texte || ""}</p>
                        ${contenuMedia}
                        <span style="font-size: 12px; color: #888; display: block; margin-top: 8px;">${new Date(statut.created_at).toLocaleString()}</span>
                    </div>
                `;

                filContainer.appendChild(carte);
            });

        } catch (error) {
            console.error("Erreur :", error.message);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        chargerStatuts();
    });

    function ouvrirPopup() {
        document.getElementById('popupPublier').style.display = 'block';
    }

    function fermerPopup() {
        document.getElementById('popupPublier').style.display = 'none';
    }

    function changerCouleur(couleur) {
        const texte = document.getElementById('texteStatut');
        texte.style.background = couleur;
        const couleursSombres = ['#002366', '#8A2BE2', '#1A1A1A', 'linear-gradient(#009E60, #EF2B2D)'];
        if (couleursSombres.includes(couleur)) {
            texte.style.color = 'white';
        } else {
            texte.style.color = 'black';
        }
    }

    const filePicker = document.getElementById('filePicker');
    const btnPublier = document.getElementById('btnPublier');
    const texteStatut = document.getElementById('texteStatut');

    filePicker.addEventListener('change', function(event) {
        const fichier = event.target.files[0];
        if (fichier) {
            if (fichier.type.startsWith('image/')) {
                const lecteur = new FileReader();
                lecteur.onload = function(e) {
                    texteStatut.style.backgroundImage = `url(${e.target.result})`;
                    texteStatut.style.backgroundSize = 'contain';
                    texteStatut.style.backgroundRepeat = 'no-repeat';
                    texteStatut.style.backgroundPosition = 'center';
                }
                lecteur.readAsDataURL(fichier);
            }
        }
    });

    btnPublier.addEventListener('click', async function() {
        const texte = texteStatut.value.trim();
        const fichier = filePicker.files[0];
        
        if (texte === "" && !fichier) {
            alert("Écris un message ou ajoute un fichier avant de publier ! ❌");
            return;
        }

        btnPublier.innerText = "Publication en cours...";
        btnPublier.disabled = true;

        try {
            let mediaUrl = null;

            if (fichier) {
                const fileName = Date.now() + '_' + fichier.name;
                const { data: uploadData, error: uploadError } = await _supabase.storage
                    .from('medias')
                    .upload(fileName, fichier);

                if (uploadError) {
                    throw new Error("Erreur lors de l'envoi du fichier : " + uploadError.message);
                }

                const { data: publicURLData } = _supabase.storage
                    .from('medias')
                    .getPublicUrl(fileName);
                    
                mediaUrl = publicURLData.publicUrl;
            }

            const { error: insertError } = await _supabase
                .from('statuts')
                .insert([
                    { 
                        texte: texte,
                        media_url: mediaUrl 
                    }
                ]);

            if (insertError) {
                throw insertError;
            }

            fermerPopup();
            texteStatut.value = "";
            texteStatut.style.backgroundImage = "none";
            filePicker.value = "";

            await chargerStatuts();

        } catch (error) {
            console.error("Erreur :", error.message);
            alert("Erreur : " + error.message);
        } finally {
            btnPublier.innerText = "PUBLIER";
            btnPublier.disabled = false;
        }
    });
</script>

</body>
</html>
