<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOALA PLATFORM</title>
    <!-- 
      ICI : TES STYLES CSS INITIAUX (RESTE INTERDIT DE MODIFICATION)
      Toutes tes couleurs, tailles, marges et designs originaux sont conservés à 100%
    -->
    <style>
        /* [TON CODE CSS INITIAL RESTE ICI - NON MODIFIÉ] */
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid-catalogue { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .space-btn { padding: 15px 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; color: white; text-align: center; }
        .space-free { background-color: #007bff; } /* Ton bleu initial */
        .space-occupied { background-color: #dc3545; } /* Ton rouge initial */
        .btn-formation { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; text-align: left; cursor: pointer; }
        .welcome-msg { color: #dc3545; font-weight: bold; margin-bottom: 15px; }
        .hidden { display: none; }
        .pay-panel { background: #fff3cd; padding: 15px; border-radius: 4px; margin-top: 15px; border: 1px solid #ffeeba; }
        #topcode, #timer { font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div id="login-screen">
    <h3>Connexion</h3>
    <input type="tel" id="phone-input" placeholder="Numéro Orange Money">
    <button onclick="connexion()">Entrer</button>
</div>

<div id="main-app" class="hidden">
    <div id="welcome-banner" class="welcome-msg"></div>
    <button onclick="deconnexion()">Déconnexion</button>
    <hr>
    
    <div class="container">
        <!-- PANNEAU GAUCHE : FORMATIONS (Dynamique pour Y) -->
        <div class="panel">
            <h3 id="formation-panel-title">Formations Disponibles</h3>
            <div id="formations-container">
                <!-- Chargé dynamiquement par le script pour afficher soit la formation principale soit celle de X -->
                <button class="btn-formation" onclick="selectionnerAchat('Formation Principale KOALA', 300, 'ton_num_depot_principal')">01. Acheter la Formation Principale (300 F)</button>
            </div>
            
            <!-- Zone de configuration si le locataire X clique sur un espace libre -->
            <div id="config-espace-zone" class="hidden" style="margin-top:20px; border-top:1px solid #ccc; padding-top:15px;">
                <h4>Configurer mon Espace <span id="selected-space-id"></span></h4>
                <p>Coût de la location : 1000 F</p>
                <input type="text" id="config-desc" placeholder="Titre/Description de votre formation" style="width:90%; margin-bottom:8px; padding:6px;"><br>
                <input type="number" id="config-prix" placeholder="Prix de vente pour les clients (ex: 300)" style="width:90%; margin-bottom:8px; padding:6px;"><br>
                <input type="tel" id="config-depot" placeholder="Votre numéro de dépôt Orange Money" style="width:90%; margin-bottom:8px; padding:6px;"><br>
                <button onclick="demanderPaiementLocation()" style="background:#007bff; color:white; padding:8px 15px; border:none; border-radius:4px; cursor:pointer;">Payer la location (1000 F)</button>
            </div>
        </div>

        <!-- PANNEAU DROIT : CATALOGUE DES 50 ESPACES -->
        <div class="panel">
            <h3>Catalogue des Espaces (<span id="count-libres">50</span> Libres)</h3>
            <div class="grid-catalogue" id="catalogue-grid">
                <!-- Les 50 boutons générés proprement -->
            </div>
        </div>
    </div>

    <!-- ÉCRAN DE PAIEMENT SIMULÉ (ORANGE MONEY) -->
    <div id="payment-screen" class="pay-panel class hidden">
        <h4>Fenêtre de Paiement Orange Money</h4>
        <p>Montant à payer : <span id="pay-amount">0</span> F CFA</p>
        <p>Destinataire : <span id="pay-recipient">En attente</span></p>
        <p id="topcode">Code USSD à composer : *101# puis option confirmation</p>
        <p id="timer">Temps restant : <span id="timer-count">120</span>s</p>
        <button onclick="annulerPaiement()">Annuler</button>
    </div>
</div>

<script>
    // --- CONFIGURATION SUPABASE (Garde tes clés ici) ---
    const SUPABASE_URL = "https://ton-projet.supabase.co";
    const SUPABASE_KEY = "ta-cle-anonsb-ici";
    
    let monNumero = "";
    let appareilID = "";
    let espacesOccupesData = {}; // Stocke les infos des espaces pour que Y puisse les lire
    let espaceEnCoursDeSelection = null;
    let transactionEnCours = null;
    let timerInterval = null;

    // 1. Initialisation et Anti-fraude (Ton code d'origine)
    window.onload = function() {
        if(!localStorage.getItem("appareilID")) {
            localStorage.setItem("appareilID", "DEV-" + Math.random().toString(36).substr(2, 9).toUpperCase());
        }
        appareilID = localStorage.getItem("appareilID");
        
        if(localStorage.getItem("phone")) {
            monNumero = localStorage.getItem("phone");
            demarrerApplication();
        }
    }

    function connexion() {
        const phone = document.getElementById("phone-input").value.trim();
        if(phone.length >= 8) {
            localStorage.setItem("phone", phone);
            monNumero = phone;
            demarrerApplication();
        } else {
            alert("Numéro invalide");
        }
    }

    function deconnexion() {
        localStorage.removeItem("phone");
        document.getElementById("main-app").classList.add("hidden");
        document.getElementById("login-screen").classList.remove("hidden");
    }

    function demarrerApplication() {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("main-app").classList.remove("hidden");
        document.getElementById("welcome-banner").innerText = "Bienvenue sur KOALA Platform, cher membre " + monNumero;
        rafraichirPlateforme();
    }

    // 2. LE COEUR DU SYSTEME : Chargement global depuis Supabase
    async function rafraichirPlateforme() {
        try {
            // On récupère tous les paiements validés (statut approuvé ou succès selon ton infrastructure)
            const response = await fetch(`${SUPABASE_URL}/rest/v1/payments?select=*`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const data = await response.json();
            
            espacesOccupesData = {};
            // On filtre pour extraire les locations valides qui possèdent un numéro d'espace
            data.forEach(pay => {
                if(pay.espace_num) {
                    espacesOccupesData[pay.espace_num] = pay;
                }
            });

            genererCatalogueEspaces();
        } catch (e) {
            console.error("Erreur de chargement", e);
        }
    }

    // 3. Dessin du catalogue et mise à jour des compteurs (50 places)
    function genererCatalogueEspaces() {
        const grid = document.getElementById("catalogue-grid");
        grid.innerHTML = "";
        let countLibres = 50;

        for (let i = 1; i <= 50; i++) {
            const btn = document.createElement("button");
            btn.className = "space-btn";
            
            if (espacesOccupesData[i]) {
                // L'espace est OCCUPÉ par X
                countLibres--;
                btn.classList.add("space-occupied");
                btn.innerText = "Espace " + (i < 10 ? "0" + i : i) + "\n[Occupé]";
                // Si quelqu'un clique, on affiche la formation vendue par X
                btn.onclick = () => afficherFormationEspaceX(i);
            } else {
                // L'espace est LIBRE
                btn.classList.add("space-free");
                btn.innerText = "Espace " + (i < 10 ? "0" + i : i) + "\n[Libre]";
                // Si le locataire clique, il ouvre la configuration pour l'acheter
                btn.onclick = () => ouvrirConfigurationEspace(i);
            }
            grid.appendChild(btn);
        }
        document.getElementById("count-libres").innerText = countLibres;
    }

    // Comportement pour le Client Y : Il voit le contenu créé par X
    function afficherFormationEspaceX(numeroEspace) {
        const dataX = espacesOccupesData[numeroEspace];
        document.getElementById("config-espace-zone").classList.add("hidden"); // Cache la zone admin
        
        const container = document.getElementById("formations-container");
        document.getElementById("formation-panel-title").innerText = "Espace " + numeroEspace + " - Formation de " + dataX.phone;
        
        // On affiche dynamiquement la description de X et son prix personnalisé !
        container.innerHTML = `
            <p><strong>Description :</strong> ${dataX.description || 'Aucune description disponible'}</p>
            <button class="btn-formation" onclick="selectionnerAchat('Formation Espace ${numeroEspace}', ${dataX.prix_venta || 300}, '${dataX.num_depot}')">
                Acheter pour ${dataX.prix_venta || 300} F CFA
            </button>
            <button onclick="revenirFormationPrincipale()" style="margin-top:10px; background:#6c757d; color:white; border:none; padding:5px 10px; cursor:pointer;">🔤 Retour à la formation principale</button>
        `;
    }

    function revenirFormationPrincipale() {
        document.getElementById("formation-panel-title").innerText = "Formations Disponibles";
        document.getElementById("formations-container").innerHTML = `
            <button class="btn-formation" onclick="selectionnerAchat('Formation Principale KOALA', 300, 'ton_num_depot_principal')">01. Acheter la Formation Principale (300 F)</button>
        `;
    }

    // Comportement pour le Locataire X : Il souhaite louer un espace libre
    function ouvrirConfigurationEspace(numeroEspace) {
        espaceEnCoursDeSelection = numeroEspace;
        document.getElementById("selected-space-id").innerText = numeroEspace;
        document.getElementById("config-espace-zone").classList.remove("hidden");
    }

    // 4. Flux de Paiement (Identique à ta logique mais connectée au bon destinataire)
    function selectionnerAchat(nom, prix, destinataire) {
        declencherFenetrePaiement(prix, destinataire, { type: "achat", nom: nom });
    }

    function demanderPaiementLocation() {
        const desc = document.getElementById("config-desc").value.trim();
        const prix = document.getElementById("config-prix").value.trim();
        const depot = document.getElementById("config-depot").value.trim();

        if(!desc || !prix || !depot) {
            alert("Veuillez remplir tous les champs de configuration.");
            return;
        }

        declencherFenetrePaiement(1000, "Compte Principal KOALA", {
            type: "location",
            espace: espaceEnCoursDeSelection,
            description: desc,
            prix_venta: prix,
            num_depot: depot
        });
    }

    async function declencherFenetrePaiement(montant, destinataire, metadonnees) {
        document.getElementById("pay-amount").innerText = montant;
        document.getElementById("pay-recipient").innerText = destinataire;
        document.getElementById("payment-screen").classList.remove("hidden");

        // Enregistrement de l'intention de paiement dans Supabase
        const payload = {
            phone: monNumero,
            appareil_id: appareilID,
            montant: montant,
            status: "en_attente",
            // On sauvegarde l'espace pour que l'application sache quoi libérer après validation
            espace_num: metadonnees.type === "location" ? metadonnees.espace : null,
            description: metadonnees.description || null,
            prix_venta: metadonnees.prix_venta || null,
            num_depot: metadonnees.num_depot || null
        };

        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/payments`, {
                method: "POST",
                headers: { 
                    "apikey": SUPABASE_KEY, 
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=representation"
                },
                body: JSON.stringify(payload)
            });
            const enregistrement = await res.json();
            transactionEnCours = enregistrement[0];

            // Lancement du compte à rebours et surveillance (Tes fonctions d'origine)
            demarrerChrono();
            lancerSurveillanceAutomatique();
        } catch(e) {
            alert("Erreur lors de l'initialisation du paiement.");
        }
    }

    // 5. Fonctions de Surveillance Utilitaires (Ton code d'origine adapté pour rafraîchir les 50 places)
    function demarrerChrono() {
        let temps = 120;
        clearInterval(timerInterval);
        document.getElementById("timer-count").innerText = temps;
        timerInterval = setInterval(() => {
            temps--;
            document.getElementById("timer-count").innerText = temps;
            if(temps <= 0) {
                annulerPaiement();
            }
        }, 1000);
    }

    let surveillanceInterval = null;
    function lancerSurveillanceAutomatique() {
        clearInterval(surveillanceInterval);
        surveillanceInterval = setInterval(async () => {
            if(!transactionEnCours) return;
            
            const res = await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${transactionEnCours.id}&select=status`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const data = await res.json();
            
            if(data && data[0] && data[0].status === "approuve") {
                clearInterval(surveillanceInterval);
                clearInterval(timerInterval);
                document.getElementById("payment-screen").classList.add("hidden");
                alert("Félicitations ! Votre paiement a été détecté et validé.");
                transactionEnCours = null;
                rafraichirPlateforme(); // Met à jour le catalogue des 50 places instantanément !
            }
        }, 5000); // Vérifie toutes les 5 secondes
    }

    function annulerPaiement() {
        clearInterval(timerInterval);
        clearInterval(surveillanceInterval);
        document.getElementById("payment-screen").classList.add("hidden");
        transactionEnCours = null;
    }
</script>
</body>
</html>
