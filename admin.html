<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>KOALA - Panel Administration Officiel</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:20px;color:#333;}
.box{max-width:850px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.2);}
.item{background:#eee;padding:15px;margin:10px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border-left:5px solid gold;}
button{padding:10px 15px;cursor:pointer;border-radius:5px;font-weight:bold;border:none;}
.btn-primary {background:#2196F3; color:white; margin-right: 10px;}
.btn-success {background:green; color:white; margin-right:5px;}
.btn-danger {background:red; color:white; margin-right:5px;}
.btn-delete {background:#d32f2f; color:white;}
.badge{padding:4px 8px;border-radius:4px;color:white;font-size:12px;font-weight:bold;}
.badge-vendeur{background:#9c27b0;}
.badge-client{background:#009688;}
.action-bar { background: #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

#authBox { text-align: center; max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
#authBox input { width: 100%; padding: 10px; margin-top: 15px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; text-align: center; }
</style>
</head>
<body>

<div id="authBox">
    <h2>🔑 Accès Administrateur</h2>
    <p>Veuillez entrer le code secret pour déverrouiller le panel.</p>
    <input type="password" id="adminCodeField" placeholder="Code d'accès">
    <button onclick="verifierCodeAdmin()" style="background:#9c27b0; color:white; width:100%; margin-top:15px; font-size:16px;">Connexion</button>
</div>

<div class="box" id="panelAdminPrincipal" style="display:none;">
    <h2>🟣 KOALA - Gestion des Validations Réelles</h2>
    <div class="action-bar">
        <button class="btn-primary" onclick="load()">🔄 Actualiser</button>
        <button class="btn-primary" style="background:#555;" onclick="selectionnerTout()">📋 Sélectionner Tout</button>
        <span style="margin-left:auto; font-weight:bold;">Actions groupées :</span>
        <button class="btn-success" onclick="validerSelectionnes()">✔ Valider Sélection</button>
        <button class="btn-danger" onclick="bloquerSelectionnes()">🔒 Bloquer Sélection</button>
        <button class="btn-delete" onclick="supprimerSelectionnes()">🗑️ Supprimer Sélection</button>
    </div>
    <div id="list">Chargement des demandes...</div>
</div>

<script>
const SUPABASE_URL = "https://gkqlmpkmzfvurkzgrjlm.supabase.co";
const SUPABASE_KEY = "sb_publishable_TpKfbr8y19-DzT9dQvlr5Q_2MR-ciXr";
const SECRET_CODE_VALID = "2005koala";

let verifié = false;

function verifierCodeAdmin() {
    const codeSaisi = document.getElementById("adminCodeField").value.trim();
    if(codeSaisi === SECRET_CODE_VALID) {
        verifié = true;
        document.getElementById("authBox").style.display = "none";
        document.getElementById("panelAdminPrincipal").style.display = "block";
        load();
        setInterval(load, 12000);
    } else {
        alert("Code d'accès incorrect ! ❌");
    }
}

async function validerRetrait(id, montant, phone) {
    if(!confirm(`Valider le retrait de ${montant} F CFA pour ${phone} ?`)) return;
    await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
        method: "PATCH",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ status: "payé" })
    });
    load();
}

async function load(){
    if(!verifié) return;
    const listDiv = document.getElementById("list");
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/payments?select=*`, {
            headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }
        });
        let data = await res.json();
        if(!data || data.length === 0) { listDiv.innerHTML = "<p>Aucune demande trouvée. 📭</p>"; return; }
        data.sort((a, b) => b.id - a.id);

        let html = "";
        data.forEach(p => {
            const isConfirmed = p.status === "confirmé";
            const estVendeur = (p.amount === 1000 || p.role === "vendeur");
            let infoEspaceLocataire = estVendeur && p.description ? 
                `<div style="background:#fff; padding:5px; margin-top:5px; border-radius:4px; font-size:12px;">📌 <b>Espace :</b> ${p.description} <br> 💰 <b>Prix :</b> ${p.prix_vente || 0} F | 📞 <b>Dépôt :</b> ${p.num_depot || 'Non défini'}</div>` : "";

            let boutons = `
                <button class="btn-success" onclick="executerValidationUnique('${p.id}', '${estVendeur ? 'vendeur' : 'client'}')">✔</button>
                <button class="btn-danger" onclick="executerBloquerUnique('${p.id}')">🔒</button>
                <button class="btn-delete" onclick="executerSuppressionTotale('${p.id}', '${p.phone}')">🗑️</button>
            `;

            if (p.status === "demande_retrait") {
                boutons = `<button class="btn-success" style="background:orange;" onclick="validerRetrait('${p.id}', '${p.amount}', '${p.phone}')">Valider Retrait</button>`;
            }

            html += `
            <div class="item" style="border-left: 6px solid ${isConfirmed ? 'green' : 'gold'};">
                <div style="display:flex; align-items:center; gap:15px;">
                    <input type="checkbox" class="checkbox-select" data-id="${p.id}" data-role="${estVendeur ? 'vendeur' : 'client'}">
                    <div>
                        <span class="badge ${estVendeur ? 'badge-vendeur' : 'badge-client'}">${estVendeur ? '🏠 VENDEUR' : '📖 CLIENT'}</span> 
                        📞 <b>${p.phone}</b> (Montant: ${p.amount || 0} F)<br>
                        Statut : <b>${p.status}</b> | Code : <b style="color:blue;">${p.code || "Aucun"}</b>
                        ${infoEspaceLocataire}
                    </div>
                </div>
                <div>${boutons}</div>
            </div>`;
        });
        listDiv.innerHTML = html;
    } catch (e) { listDiv.innerHTML = "<p style='color:red;'>Erreur Supabase ❌</p>"; }
}

function selectionnerTout() { document.querySelectorAll('.checkbox-select').forEach(cb => cb.checked = true); }

async function executerValidationUnique(id, role) {
    const code = Math.random().toString(36).substring(2,8).toUpperCase();
    const d = new Date();
    if(role === 'vendeur') d.setDate(d.getDate() + 30); else d.setHours(d.getHours() + 72);
    await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
        method: "PATCH",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
        body: JSON.stringify({ status: "confirmé", code: code, expires_at: d.toISOString() })
    });
    load();
}

async function executerBloquerUnique(id) {
    await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
        method: "PATCH",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
        body: JSON.stringify({ status: "bloqué" })
    });
    load();
}

async function executerSuppressionTotale(id, phone) {
    if(confirm(`Supprimer le compte ${phone} ?`)) {
        await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, { method: "DELETE", headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
        load();
    }
}

async function validerSelectionnes() {
    const boxes = document.querySelectorAll('.checkbox-select:checked');
    for(let cb of boxes) await executerValidationUnique(cb.dataset.id, cb.dataset.role);
    load();
}

async function bloquerSelectionnes() {
    const boxes = document.querySelectorAll('.checkbox-select:checked');
    for(let cb of boxes) await executerBloquerUnique(cb.dataset.id);
    load();
}

async function supprimerSelectionnes() {
    const boxes = document.querySelectorAll('.checkbox-select:checked');
    if(confirm("Confirmer la suppression de la sélection ?")) {
        for(let cb of boxes) await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${cb.dataset.id}`, { method: "DELETE", headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
        load();
    }
}
</script>
</body>
</html>
