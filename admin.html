<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>KOALA - Panel Administration Officiel</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:20px;color:#333;}
.box{max-width:850px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.2);}
.item{background:#eee;padding:15px;margin:10px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border-left:5px solid gold;}
button{padding:10px 15px;cursor:pointer;border-radius:5px;font-weight:bold;border:none;}
.btn-primary {background:#2196F3; color:white; margin-right: 10px;}
.btn-success {background:green; color:white; margin-right:5px;}
.btn-danger {background:red; color:white; margin-right:5px;}
.btn-delete {background:#d32f2f; color:white;} /* Style spécifique bouton supprimer */
.badge{padding:4px 8px;border-radius:4px;color:white;font-size:12px;font-weight:bold;}
.badge-vendeur{background:#9c27b0;}
.badge-client{background:#009688;}
.action-bar { background: #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

/* Zone d'authentification admin */
#authBox { text-align: center; max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
#authBox input { width: 100%; padding: 10px; margin-top: 15px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; text-align: center; }
</style>
</head>
<body>

<!-- 🔐 ÉCRAN SÉCURITÉ ADMIN -->
<div id="authBox">
    <h2>🔑 Accès Administrateur</h2>
    <p>Veuillez entrer le code secret pour déverrouiller le panel.</p>
    <input type="password" id="adminCodeField" placeholder="Code d'accès">
    <button onclick="verifierCodeAdmin()" style="background:#9c27b0; color:white; width:100%; margin-top:15px; font-size:16px;">Connexion</button>
</div>

<!-- 🟣 PANEL PRINCIPAL (Masqué par défaut) -->
<div class="box" id="panelAdminPrincipal" style="display:none;">
<h2>🟣 KOALA - Gestion des Validations Réelles</h2>

<!-- VRAIE BARRE D'ACTIONS GROUPÉES -->
<div class="action-bar">
    <button class="btn-primary" onclick="load()">🔄 Actualiser</button>
    <button class="btn-primary" style="background:#555;" onclick="selectionnerTout()">📋 Sélectionner Tout</button>
    <span style="margin-left:auto; font-weight:bold;">Actions groupées :</span>
    <button class="btn-success" onclick="validerSelectionnes()">✔ Valider Sélection</button>
    <button class="btn-danger" onclick="bloquerSelectionnes()">🔒 Bloquer Sélection</button>
</div>

<div id="list">Chargement des demandes...</div>
</div>

<script>
const SUPABASE_URL = "https://gkqlmpkmzfvurkzgrjlm.supabase.co";
const SUPABASE_KEY = "sb_publishable_TpKfbr8y19-DzT9dQvlr5Q_2MR-ciXr";
const SECRET_CODE_VALID = "2005koala";

let casesCochees = [];
let verifié = false;

function verifierCodeAdmin() {
    const codeSaisi = document.getElementById("adminCodeField").value.trim();
    if(codeSaisi === SECRET_CODE_VALID) {
        verifié = true;
        document.getElementById("authBox").style.display = "none";
        document.getElementById("panelAdminPrincipal").style.display = "block";
        load();
        setInterval(load, 12000);
    } else {
        alert("Code d'accès incorrect ! ❌ Access Refusé.");
    }
}

async function load(){
    if(!verifié) return; // Sécurité blocage requêtes
    const listDiv = document.getElementById("list");
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/payments?select=*`, {
            headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }
        });
        let data = await res.json();

        if(!data || data.length === 0) {
            listDiv.innerHTML = "<p>Aucune demande trouvée. 📭</p>";
            return;
        }

        data.sort((a, b) => b.id - a.id);

        let html = "";
        data.forEach(p => {
            const isConfirmed = p.status === "confirmé";
            const estVendeur = (p.amount === 1000 || p.role === "vendeur");
            
            // Affichage des informations réelles envoyées par le locataire
            let infoEspaceLocataire = "";
            if(estVendeur && p.description) {
                infoEspaceLocataire = `<div style="background:#fff; padding:5px; margin-top:5px; border-radius:4px; font-size:12px;">
                    📌 <b>Espace Configuré :</b> ${p.description} <br>
                    💰 <b>Prix demandé :</b> ${p.prix_vente || 0} F | 📞 <b>Dépôt :</b> ${p.num_depot || 'Non défini'} <br>
                    📁 <b>Fichier lié :</b> ${p.name_file || 'Aucun'}
                </div>`;
            }

            const badgeType = estVendeur ? 
                `<span class="badge badge-vendeur">🏠 VENDEUR (30j)</span>` : 
                `<span class="badge badge-client">📖 CLIENT (72h)</span>`;

            html += `
            <div class="item" style="border-left: 6px solid ${isConfirmed ? 'green' : 'gold'};">
                <div style="display:flex; align-items:center; gap:15px;">
                    <input type="checkbox" class="checkbox-select" data-id="${p.id}" data-role="${estVendeur ? 'vendeur' : 'client'}">
                    <div>
                        ${badgeType} 📞 <b>Numéro : ${p.phone}</b> (Montant: ${p.amount || 0} F)<br>
                        Statut : <b>${p.status}</b> | Code : <b style="color:blue;">${p.code || "Aucun"}</b><br>
                        ${infoEspaceLocataire}
                    </div>
                </div>
                <div style="display:flex; align-items:center;">
                    <button class="btn-success" onclick="executerValidationUnique('${p.id}', '${estVendeur ? 'vendeur' : 'client'}')">✔ Valider</button>
                    <button class="btn-danger" onclick="executerBloquerUnique('${p.id}')">🔒 Bloquer</button>
                    <!-- Nouveau Bouton de suppression totale -->
                    <button class="btn-delete" onclick="executerSuppressionTotale('${p.id}', '${p.phone}')">🗑️ Supprimer</button>
                </div>
            </div>
            `;
        });

        listDiv.innerHTML = html;
    } catch (error) {
        listDiv.innerHTML = "<p style='color:red;'>Erreur Supabase ❌</p>";
    }
}

// COCHER TOUT LE MONDE RÉELLEMENT
function selectionnerTout() {
    const checkboxes = document.querySelectorAll('.checkbox-select');
    checkboxes.forEach(cb => cb.checked = true);
}

// ACTIONS INDIVIDUELLES RÉELLES
async function executerValidationUnique(id, role) {
    const code = Math.random().toString(36).substring(2,8).toUpperCase();
    const d = new Date();
    if(role === 'vendeur') { d.setDate(d.getDate() + 30); } else { d.setHours(d.getHours() + 72); }
    
    await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
        method: "PATCH",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ status: "confirmé", code: code, expires_at: d.toISOString() })
    });
    load();
}

async function executerBloquerUnique(id) {
    await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
        method: "PATCH",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ status: "bloqué" })
    });
    load();
}

// SUPPRESSION TOTALE ET LIBÉRATION DE L'ESPACE
async function executerSuppressionTotale(id, telephone) {
    const confirmation = confirm(`⚠ ATTENTION : Voulez-vous supprimer entièrement le compte lié au numéro ${telephone} ?\n\nCette action effacera ses données et libérera immédiatement son espace sur le catalogue.`);
    
    if (confirmation) {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
                method: "DELETE",
                headers: { 
                    apikey: SUPABASE_KEY, 
                    Authorization: `Bearer ${SUPABASE_KEY}` 
                }
            });
            
            if(res.ok) {
                alert("Compte supprimé avec succès ! L'espace est à nouveau libre. 🍃");
                load();
            } else {
                alert("Erreur lors de la suppression du compte ❌");
            }
        } catch (error) {
            console.error(error);
            alert("Erreur de connexion réseau Supabase ❌");
        }
    }
}

// VRAIE VALIDATION GROUPÉE DE TOUTE LA SÉLECTION
async function validerSelectionnes() {
    const checkboxes = document.querySelectorAll('.checkbox-select:checked');
    if(checkboxes.length === 0) { alert("Aucune ligne cochée ! ❌"); return; }
    
    for(let cb of checkboxes) {
        const id = cb.getAttribute('data-id');
        const role = cb.getAttribute('data-role');
        const code = Math.random().toString(36).substring(2,8).toUpperCase();
        const d = new Date();
        if(role === 'vendeur') { d.setDate(d.getDate() + 30); } else { d.setHours(d.getHours() + 72); }

        await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
            method: "PATCH",
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({ status: "confirmé", code: code, expires_at: d.toISOString() })
        });
    }
    alert("Toute la sélection a été validée avec succès ! 🔥");
    load();
}

// VRAI BLOCAGE GROUPÉ DE TOUTE LA SÉLECTION
async function bloquerSelectionnes() {
    const checkboxes = document.querySelectorAll('.checkbox-select:checked');
    if(checkboxes.length === 0) { alert("Aucune ligne cochée ! ❌"); return; }

    for(let cb of checkboxes) {
        const id = cb.getAttribute('data-id');
        await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
            method: "PATCH",
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({ status: "bloqué" })
        });
    }
    alert("Toute la sélection a été bloquée ! 🔒");
    load();
}
</script>
</body>
</html>
