<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>KOALA - Master Admin Panel</title>
<style>
body{font-family:Arial, sans-serif;background:#f4f4f4;padding:20px;}
.box{max-width:850px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
.item{background:#eee;padding:15px;margin:10px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;}
button{padding:10px 15px;cursor:pointer;border-radius:5px;font-weight:bold;border:none;}
.btn-success {background:green; color:white;}
.badge-vendeur { background:#7B1FA2; color:white; padding:4px 8px; border-radius:4px; font-size:11px; }
.badge-client { background:#0288D1; color:white; padding:4px 8px; border-radius:4px; font-size:11px; }
</style>
</head>
<body>

<div class="box">
<h2>🟣 KOALA DRIVE — Contrôle Général Administrateur</h2>
<div id="list" style="margin-top:20px;">Chargement du réseau...</div>
</div>

<script>
const SUPABASE_URL = "https://gkqlmpkmzfvurkzgrjlm.supabase.co";
const SUPABASE_KEY = "sb_publishable_TpKfbr8y19-DzT9dQvlr5Q_2MR-ciXr";

async function load(){
    const listDiv = document.getElementById("list");
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/payments?select=*`, {
            headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }
        });
        let data = await res.json();
        if(!data || data.length === 0) { listDiv.innerHTML = "<p>Aucune activité.</p>"; return; }

        data.sort((a, b) => b.id - a.id);

        let html = "";
        data.forEach(p => {
            const isConfirmed = p.status === "confirmé";
            const isExpired = p.expires_at ? new Date(p.expires_at) < new Date() : false;
            const badge = p.role === "vendeur" ? `<span class="badge-vendeur">VENDEUR (30j)</span>` : `<span class="badge-client">SOUS-CLIENT (72h)</span>`;
            
            let statutText = p.status === "en attente" ? "<span style='color:orange;'>⏳ En attente validation</span>" : "<span style='color:green;'>✔ Activé</span>";
            if(isConfirmed && isExpired) statutText = "<span style='color:red;'>❌ Expired</span>";

            html += `
            <div class="item" style="border-left: 6px solid ${p.role === 'vendeur' ? '#7B1FA2' : '#0288D1'};">
                <div>
                    ${badge} <b>N° : ${p.phone}</b><br>
                    Statut : ${statutText}<br>
                    Code généré : <b>${p.code || "Aucun"}</b><br>
                    Fin d'accès : <b>${p.expires_at ? new Date(p.expires_at).toLocaleString('fr-FR') : "Pas de date"}</b>
                </div>
                <div>
                    <button class="btn-success" onclick="validerCompte('${p.id}', '${p.role}')">
                        ✔ Valider le Paiement
                    </button>
                </div>
            </div>
            `;
        });
        listDiv.innerHTML = html;
    } catch (e) { listDiv.innerHTML = "Erreur de connexion."; }
}

async function validerCompte(id, role) {
    const codeUnique = Math.random().toString(36).substring(2,8).toUpperCase();
    const dateButoir = new Date();

    if(role === "vendeur") {
        // Le vendeur obtient 30 jours complets
        dateButoir.setDate(dateButoir.getDate() + 30);
    } else {
        // Le sous-client obtient exactement 72 heures chrono
        dateButoir.setHours(dateButoir.getHours() + 72);
    }

    await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
        method: "PATCH",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            status: "confirmé",
            code: codeUnique,
            expires_at: dateButoir.toISOString()
        })
    });
    alert(`Compte activé avec succès pour ce ${role} !`);
    load();
}

load();
setInterval(load, 4000);
</script>
</body>
</html>
