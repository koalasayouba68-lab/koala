<script>
const SUPABASE_URL = "https://gkqlmpkmzfvurkzgrjlm.supabase.co";
const SUPABASE_KEY = "sb_publishable_TpKfbr8y19-DzT9dQvlr5Q_2MR-ciXr";
const SECRET_CODE_VALID = "2005koala";

let casesCochees = [];
let verifié = false;

function verifierCodeAdmin() {
    const codeSaisi = document.getElementById("adminCodeField").value.trim();
    if(codeSaisi === SECRET_CODE_VALID) {
        verifié = true;
        document.getElementById("authBox").style.display = "none";
        document.getElementById("panelAdminPrincipal").style.display = "block";
        load();
        setInterval(load, 12000);
    } else {
        alert("Code d'accès incorrect ! ❌ Access Refusé.");
    }
}

async function load(){
    if(!verifié) return;
    const listDiv = document.getElementById("list");
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/payments?select=*`, {
            headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }
        });
        let data = await res.json();

        if(!data || data.length === 0) {
            listDiv.innerHTML = "<p>Aucune demande trouvée. 📭</p>";
            return;
        }

        data.sort((a, b) => b.id - a.id);

        let html = "";
        data.forEach(p => {
            const isConfirmed = p.status === "confirmé";
            const estVendeur = (p.amount === 1000 || p.role === "vendeur");
            
            let infoEspaceLocataire = "";
            if(estVendeur && p.description) {
                infoEspaceLocataire = `<div style="background:#fff; padding:5px; margin-top:5px; border-radius:4px; font-size:12px;">
                    📌 <b>Espace Configuré :</b> ${p.description} <br>
                    💰 <b>Prix demandé :</b> ${p.prix_vente || 0} F | 📞 <b>Dépôt :</b> ${p.num_depot || 'Non défini'} <br>
                    📁 <b>Fichier lié :</b> ${p.name_file || 'Aucun'}
                </div>`;
            }

            const badgeType = estVendeur ? 
                `<span class="badge badge-vendeur">🏠 VENDEUR (30j)</span>` : 
                `<span class="badge badge-client">📖 CLIENT (72h)</span>`;

            html += `
            <div class="item" style="border-left: 6px solid ${isConfirmed ? 'green' : 'gold'};">
                <div style="display:flex; align-items:center; gap:15px;">
                    <input type="checkbox" class="checkbox-select" data-id="${p.id}" data-role="${estVendeur ? 'vendeur' : 'client'}">
                    <div>
                        ${badgeType} 📞 <b>Numéro : ${p.phone}</b> (Montant: ${p.amount || 0} F)<br>
                        Statut : <b>${p.status}</b> | Code : <b style="color:blue;">${p.code || "Aucun"}</b><br>
                        ${infoEspaceLocataire}
                    </div>
                </div>
                <div style="display:flex; align-items:center;">
                    <button class="btn-success" onclick="executerValidationUnique('${p.id}', '${estVendeur ? 'vendeur' : 'client'}')">✔ Valider</button>
                    <button class="btn-danger" onclick="executerBloquerUnique('${p.id}')">🔒 Bloquer</button>
                    <button class="btn-delete" onclick="executerSuppressionTotale('${p.id}', '${p.phone}')">🗑️ Supprimer</button>
                </div>
            </div>
            `;
        });

        listDiv.innerHTML = html;
    } catch (error) {
        listDiv.innerHTML = "<p style='color:red;'>Erreur Supabase ❌</p>";
    }
}

function selectionnerTout() {
    const checkboxes = document.querySelectorAll('.checkbox-select');
    checkboxes.forEach(cb => cb.checked = true);
}

// ACTIONS INDIVIDUELLES RÉELLES
async function executerValidationUnique(id, role) {
    const code = Math.random().toString(36).substring(2,8).toUpperCase();
    const d = new Date();
    if(role === 'vendeur') { d.setDate(d.getDate() + 30); } else { d.setHours(d.getHours() + 72); }
    
    await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
        method: "PATCH",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
        body: JSON.stringify({ status: "confirmé", code: code, expires_at: d.toISOString() })
    });
    load();
}

async function executerBloquerUnique(id) {
    await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
        method: "PATCH",
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
        body: JSON.stringify({ status: "bloqué" })
    });
    load();
}

// SUPPRESSION TOTALE INDIVIDUELLE
async function executerSuppressionTotale(id, telephone) {
    const confirmation = confirm(`⚠ ATTENTION : Voulez-vous supprimer entièrement le compte lié au numéro ${telephone} ?\n\nCette action effacera ses données et libérera immédiatement son espace sur le catalogue.`);
    if (confirmation) {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
                method: "DELETE",
                headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
            });
            if(res.ok) {
                alert("Compte supprimé avec succès ! L'espace est à nouveau libre. 🍃");
                load();
            } else {
                alert("Erreur lors de la suppression du compte ❌");
            }
        } catch (error) {
            console.error(error);
            alert("Erreur de connexion réseau Supabase ❌");
        }
    }
}

// VRAIE VALIDATION GROUPÉE DE TOUTE LA SÉLECTION
async function validerSelectionnes() {
    const checkboxes = document.querySelectorAll('.checkbox-select:checked');
    if(checkboxes.length === 0) { alert("Aucune ligne cochée ! ❌"); return; }
    for(let cb of checkboxes) {
        const id = cb.getAttribute('data-id');
        const role = cb.getAttribute('data-role');
        const code = Math.random().toString(36).substring(2,8).toUpperCase();
        const d = new Date();
        if(role === 'vendeur') { d.setDate(d.getDate() + 30); } else { d.setHours(d.getHours() + 72); }
        await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
            method: "PATCH",
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
            body: JSON.stringify({ status: "confirmé", code: code, expires_at: d.toISOString() })
        });
    }
    alert("Toute la sélection a été validée avec succès ! 🔥");
    load();
}

// VRAI BLOCAGE GROUPÉ DE TOUTE LA SÉLECTION
async function bloquerSelectionnes() {
    const checkboxes = document.querySelectorAll('.checkbox-select:checked');
    if(checkboxes.length === 0) { alert("Aucune ligne cochée ! ❌"); return; }
    for(let cb of checkboxes) {
        const id = cb.getAttribute('data-id');
        await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
            method: "PATCH",
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
            body: JSON.stringify({ status: "bloqué" })
        });
    }
    alert("Toute la sélection a été bloquée ! 🔒");
    load();
}

// NOUVELLE FONCTION : SUPPRESSION GROUPÉE DE TOUTE LA SÉLECTION COCHÉE
async function supprimerSelectionnes() {
    const checkboxes = document.querySelectorAll('.checkbox-select:checked');
    if(checkboxes.length === 0) { alert("Aucune ligne cochée ! ❌"); return; }
    const confirmation = confirm(`⚠ ATTENTION CRITIQUE : Vous allez supprimer ENTIÈREMENT les ${checkboxes.length} comptes sélectionnés.\n\nCette action est irréversible et libérera leurs espaces. Continuer ?`);
    if(confirmation) {
        for(let cb of checkboxes) {
            const id = cb.getAttribute('data-id');
            await fetch(`${SUPABASE_URL}/rest/v1/payments?id=eq.${id}`, {
                method: "DELETE",
                headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
            });
        }
        alert("Tous les éléments sélectionnés ont été définitivement supprimés ! 🍃");
        load();
    }
}
</script>
